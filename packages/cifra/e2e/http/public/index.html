<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cifra HTTP Exchange</title>
		<style>
			:root {
				color-scheme: light;
				--bg: #f4f2ed;
				--panel: #fffaf2;
				--ink: #1c1a16;
				--muted: #6b6156;
				--accent: #b84a1b;
				--border: #e1d6c8;
				--shadow: 0 12px 32px rgba(28, 26, 22, 0.08);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family: "Charter", "Palatino Linotype", "Book Antiqua", serif;
				background: radial-gradient(circle at top, #fff8eb, var(--bg));
				color: var(--ink);
				min-height: 100vh;
				padding: 32px;
			}

			main {
				max-width: 1100px;
				margin: 0 auto;
				display: grid;
				gap: 24px;
			}

			header {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}

			header h1 {
				margin: 0;
				font-size: 32px;
				letter-spacing: 0.02em;
			}

			header p {
				margin: 0;
				color: var(--muted);
				max-width: 680px;
			}

			.split {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
				gap: 20px;
			}

			.panel {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 20px;
				padding: 20px;
				box-shadow: var(--shadow);
				display: flex;
				flex-direction: column;
				gap: 16px;
				min-height: 280px;
			}

			.panel h2 {
				margin: 0;
				font-size: 20px;
				text-transform: uppercase;
				letter-spacing: 0.12em;
				color: var(--accent);
			}

			ul {
				list-style: none;
				padding: 0;
				margin: 0;
				display: flex;
				flex-direction: column;
				gap: 10px;
				font-size: 14px;
			}

			li {
				padding: 10px 12px;
				background: #fff;
				border: 1px solid var(--border);
				border-radius: 12px;
				line-height: 1.3;
			}

			.status {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 14px 18px;
				border-radius: 14px;
				border: 1px solid var(--border);
				background: #fff4e4;
				font-weight: 600;
			}

			.status span {
				color: var(--accent);
				font-weight: 700;
			}

			@media (max-width: 720px) {
				body {
					padding: 20px;
				}

				header h1 {
					font-size: 26px;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<h1>Cifra HTTP Channel</h1>
				<p>
					Initiator and responder exchange a signed hello/reply and encrypt a payload.
					Each side logs its view of the exchange below.
				</p>
			</header>

			<section class="split">
				<div class="panel">
					<h2>Initiator</h2>
					<ul data-testid="initiator-log" id="initiator-log"></ul>
				</div>
				<div class="panel">
					<h2>Responder</h2>
					<ul data-testid="responder-log" id="responder-log"></ul>
				</div>
			</section>

			<div class="status" data-testid="exchange-status" id="exchange-status">
				<span>Pending</span>
				<div>Waiting for exchange to complete.</div>
			</div>
		</main>
		<script type="module" src="./app.js"></script>
	</body>
</html>
